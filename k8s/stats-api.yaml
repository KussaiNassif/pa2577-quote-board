# stats-api: computes statistics from quotes-api over REST (no database access).
apiVersion: v1
kind: ConfigMap
metadata:
  name: stats-api-config
  namespace: quoteboard
data:
  QUOTES_API_URL: "http://quotes-api:3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-api
  namespace: quoteboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stats-api
  template:
    metadata:
      labels:
        app: stats-api
    spec:
      containers:
        - name: stats-api
          image: kussainassif/stats-api:1.0.2
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: stats-api-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stats-api
  namespace: quoteboard
spec:
  selector:
    app: stats-api
  ports:
    - port: 3001
      targetPort: 3001
